name: CI

on:
  push:
    branches: [master]
  pull_request:
  # So a run can be started by hand, for example after the account's Actions limit is sorted out.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The unit tests also paint every scene of the board to PNG, so a failed layout is visible.
      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Keep the board renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: board-renders
          path: app/build/renders
          if-no-files-found: ignore

      - name: Keep the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
